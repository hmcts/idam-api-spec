plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.hmcts'
version = providers.environmentVariable('RELEASE_VERSION').orElse('5.0.0-SNAPSHOT').get()
description = 'Swagger specifications and generated Java contracts for the HMCTS IdAM APIs'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

repositories {
    mavenCentral()
}

dependencies {
    // These APIs are referenced by the generated public contracts and models.
    api 'org.springframework:spring-web:7.0.9'
    api 'org.springframework:spring-context:7.0.9'
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
    api 'io.swagger:swagger-annotations:1.6.16'
    api 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    api 'jakarta.validation:jakarta.validation-api:3.1.1'
    api 'org.slf4j:slf4j-api:2.0.18'

    // @Generated is source metadata and is not needed by consumers at runtime.
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        main(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = rootProject.name
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'AzureArtifacts'
            url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
            credentials {
                username = System.getenv('AZURE_DEVOPS_ARTIFACT_USERNAME')
                password = System.getenv('AZURE_DEVOPS_ARTIFACT_TOKEN')
            }
        }
    }
}

tasks.register('verifyPublishedDependencies') {
    group = 'verification'
    description = 'Checks that the published POM exposes only the intended dependencies.'
    dependsOn tasks.named('generatePomFileForMainPublication')

    doLast {
        def pom = layout.buildDirectory.file('publications/main/pom-default.xml').get().asFile.text
        def dependencyPattern = ~/(?s)<dependency>\s*<groupId>([^<]+)<\/groupId>\s*<artifactId>([^<]+)<\/artifactId>.*?<\/dependency>/
        def actual = (pom =~ dependencyPattern).collect { match -> "${match[1]}:${match[2]}" } as Set
        def expected = [
            'org.springframework:spring-web',
            'org.springframework:spring-context',
            'com.fasterxml.jackson.core:jackson-databind',
            'io.swagger:swagger-annotations',
            'jakarta.servlet:jakarta.servlet-api',
            'jakarta.validation:jakarta.validation-api',
            'org.slf4j:slf4j-api'
        ] as Set

        if (actual != expected) {
            throw new GradleException("Published dependencies differ from the allowlist. Expected ${expected}, found ${actual}")
        }
    }
}

check.dependsOn tasks.named('verifyPublishedDependencies')
